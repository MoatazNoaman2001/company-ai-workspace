name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No .env or key files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|id_ed25519'; then
            echo "::error::secret-looking file is tracked"; exit 1
          fi

      - name: Compose file is valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yaml config --quiet

      - name: librechat.yaml parses
        run: python3 -c "import yaml; yaml.safe_load(open('deploy/librechat.yaml'))"

      - name: Shell scripts pass shellcheck
        run: shellcheck scripts/*.sh

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_DIR: /opt/company-ai
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload release files
        run: |
          tar -czf - -C deploy compose.yaml librechat.yaml .env.example \
                     -C ../scripts deploy.sh bootstrap-env.sh \
            | ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                "mkdir -p $APP_DIR && tar --no-same-owner -xzf - -C $APP_DIR"

      - name: Deploy
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash $APP_DIR/deploy.sh"
