name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/moataznoaman2001

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No .env or key files committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|id_ed25519'; then
            echo "::error::secret-looking file is tracked"; exit 1
          fi

      - name: Compose file is valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.yaml config --quiet

      - name: librechat.yaml parses
        run: python3 -c "import yaml; yaml.safe_load(open('deploy/librechat.yaml'))"

      - name: Shell scripts pass shellcheck
        run: shellcheck scripts/*.sh

  test-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mcp-google]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  images:
    needs: [validate, test-services]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [mcp-google]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/company-ai-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/company-ai-${{ matrix.service }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: /opt/company-ai
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload release files
        run: |
          tar -czf - -C deploy compose.yaml librechat.yaml .env.example \
                     -C ../scripts deploy.sh bootstrap-env.sh tailscale-serve.sh \
            | ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                "mkdir -p $APP_DIR && tar --no-same-owner -xzf - -C $APP_DIR"

      # Registry login uses a separate Docker config dir under APP_DIR, so the other project's
      # Docker credentials on this server are never touched, and the short-lived token is removed after.
      - name: Deploy this commit's images
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            export DOCKER_CONFIG=$APP_DIR/.docker && mkdir -p \$DOCKER_CONFIG && chmod 700 \$DOCKER_CONFIG &&
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null &&
            IMAGE_TAG=${{ github.sha }} bash $APP_DIR/deploy.sh; rc=\$?;
            docker logout ghcr.io >/dev/null 2>&1; exit \$rc"
