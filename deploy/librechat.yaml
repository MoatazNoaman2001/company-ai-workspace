# LibreChat configuration for the Company AI Workspace.
# Keys verified against LibreChat v0.8.8 (config 1.3.17). See docs/DECISIONS.md.
version: 1.3.17
cache: true

interface:
  # FR-15: every conversation, message, shared link and file expires.
  # Applies only to records saved after this is set, so it is on from day one.
  retentionMode: all
  generalChatRetention: 2160   # hours = 90 days
  temporaryChatRetention: 720  # hours = 30 days

registration:
  socialLogins: ['openid', 'google']
  # FR-01: only these email domains may sign in (applies to email, Google and OpenID logins).
  # Demo setup: personal Gmail via Google (consent screen in Testing mode = only listed test users).
  # A real company would list its own domain here instead. Add the Entra tenant domain when it exists.
  allowedDomains:
    - "gmail.com"

# FR-04: per-user budget, reset every 30 days. 1,000,000 credits = 1 USD.
balance:
  enabled: true
  startBalance: 2000000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 2000000

transactions:
  enabled: true

# Our MCP connectors live on the internal compose network; LibreChat blocks private hosts unless listed.
mcpSettings:
  allowedAddresses:
    - 'mcp-google:8080'

mcpServers:
  # FR-08 / D8 / D10: Drive search as the signed-in user. LibreChat runs the Google OAuth flow per user,
  # stores the token encrypted, and sends it as Bearer; mcp-google never stores tokens.
  google-workspace:
    title: 'Google Drive'
    description: 'Search and read your own Google Drive files (read-only, your permissions).'
    type: streamable-http
    url: 'http://mcp-google:8080/mcp'
    headers:
      X-Service-Secret: '${MCP_SERVICE_SECRET}'
      X-User-Email: '{{LIBRECHAT_USER_EMAIL}}'
      X-User-Id: '{{LIBRECHAT_USER_ID}}'
    requiresOAuth: true
    oauth:
      authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
      token_url: 'https://oauth2.googleapis.com/token'
      client_id: '${GOOGLE_CLIENT_ID}'
      client_secret: '${GOOGLE_CLIENT_SECRET}'
      scope: 'https://www.googleapis.com/auth/drive.readonly'
      token_endpoint_auth_methods_supported: ['client_secret_post']
    timeout: 30000
    serverInstructions: 'Use drive_search to find files, then drive_read_file to read them. Answer only from what you read and always cite the file name and link. If nothing relevant is found, say so.'

endpoints:
  # FR-03: custom providers list approved models explicitly (fetch: false), nothing else appears.
  custom:
    - name: 'Groq'
      apiKey: '${GROQ_API_KEY}'
      baseURL: 'https://api.groq.com/openai/v1/'
      models:
        default:
          - 'openai/gpt-oss-120b'
          - 'openai/gpt-oss-20b'
          - 'qwen/qwen3.8-27b'
          - 'allam-2-7b'
        fetch: false
      titleConvo: true
      titleModel: 'openai/gpt-oss-20b'
      modelDisplayLabel: 'Groq'
  agents:
    # D1 (DECISIONS.md): our approval queue is the real gate. LibreChat's tool approval only
    # blocks tools that must never run from chat, as a second safety net.
    toolApproval:
      enabled: true
      mode: bypass
      deny:
        - "mcp:*:send_*"
        - "mcp:*:submit_*"
        - "mcp:*:cancel_*"
        - "mcp:*:delete_*"
